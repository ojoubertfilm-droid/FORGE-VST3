name: Apply Key Brain v2

on:
  push:
    branches: [ forge-v0.9-build ]
    paths:
      - '.github/workflows/apply-keybrain-v2.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: forge-v0.9-build
      - name: Patch key detector in source
        shell: python
        run: |
          import re
          from pathlib import Path
          p=Path('Engine/forge_engine.py')
          s=p.read_text()
          new=r'''def detect_key(y,sr,genre="modern_metalcore"):
    """Heavy-vocal key/mode detector.

    Scores every candidate on one comparable scale.  Minor-family variants are
    only allowed to outrank Natural Minor when their characteristic scale degree
    is actually present in the audio.  This prevents ambiguous minor/pentatonic
    metal material from being mislabeled Phrygian/Dorian/Harmonic Minor.
    """
    chroma=librosa.feature.chroma_cqt(y=y.astype(float),sr=sr,hop_length=1024)
    p=np.mean(chroma,axis=1)
    p_l2=p/(np.linalg.norm(p)+1e-9)
    p_sum=np.maximum(p,0); p_sum=p_sum/(np.sum(p_sum)+1e-9)
    profile=genre_profile(genre)
    major=np.array([6.35,2.23,3.48,2.33,4.38,4.09,2.52,5.19,2.39,3.66,2.29,2.88],float)
    minor=np.array([6.33,2.68,3.52,5.38,2.60,3.53,2.54,4.75,3.98,2.69,3.34,3.17],float)
    major/=np.linalg.norm(major); minor/=np.linalg.norm(minor)
    scores=[]

    def mass(root,degree): return float(p_sum[(root+degree)%12])
    def tonic_support(root,is_minor):
        third=3 if is_minor else 4
        return .075*mass(root,0)+.035*mass(root,7)+.030*mass(root,third)
    def characteristic(delta,positive_mass,minimum=.018):
        # Evidence is deliberately asymmetric: exotic modes need affirmative
        # characteristic-note evidence; absence means "stay in parent mode".
        evidence=2.4*delta
        if positive_mass < minimum: evidence-=.055
        if delta < .004: evidence-=.040
        return evidence

    for root in range(12):
        maj_base=float(np.dot(p_l2,np.roll(major,root)))+tonic_support(root,False)
        min_base=float(np.dot(p_l2,np.roll(minor,root)))+tonic_support(root,True)
        if "major" in profile["allowed_scales"]:
            # Major should have real major-third evidence over minor-third evidence.
            maj_mode=.14*(mass(root,4)-mass(root,3))
            scores.append((maj_base+maj_mode,root,"major"))
        if "natural_minor" in profile["allowed_scales"]:
            scores.append((min_base,root,"natural_minor"))
        if "phrygian" in profile["allowed_scales"]:
            b2,n2=mass(root,1),mass(root,2)
            scores.append((min_base+characteristic(b2-n2,b2)-.006,root,"phrygian"))
        if "dorian" in profile["allowed_scales"]:
            n6,b6=mass(root,9),mass(root,8)
            scores.append((min_base+characteristic(n6-b6,n6)-.010,root,"dorian"))
        if "harmonic_minor" in profile["allowed_scales"]:
            maj7,b7=mass(root,11),mass(root,10)
            scores.append((min_base+characteristic(maj7-b7,maj7)-.008,root,"harmonic_minor"))

    scores.sort(reverse=True,key=lambda x:x[0])
    best,second=scores[0],scores[1]
    gap=max(0.0,best[0]-second[0])
    # Confidence is deliberately modest when mode/root evidence is ambiguous.
    conf=float(np.clip(.42+gap*7.5,0,1))
    root,mode=int(best[1]),str(best[2])
    return root,mode,scale_pcs(root,mode),conf
'''
          pat=r'def detect_key\(y,sr,genre="modern_metalcore"\):.*?(?=\ndef segment_notes\()'
          out,n=re.subn(pat,new.rstrip()+"\n",s,flags=re.S)
          if n!=1: raise SystemExit(f'expected one detect_key replacement, got {n}')
          p.write_text(out)
      - name: Commit key brain v2
        shell: bash
        run: |
          git config user.name "FORGE Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add Engine/forge_engine.py
          git commit -m "Fix heavy-vocal key mode discrimination"
          git push origin HEAD:forge-v0.9-build
