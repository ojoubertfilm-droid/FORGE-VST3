name: Fast Windows VST3 Compile

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  compile:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Patch JUCE 8 editor API compatibility
        shell: pwsh
        run: |
          $p = 'Source\PluginEditor.cpp'
          $s = Get-Content $p -Raw
          $s = $s.Replace('in.removeFromTop (70.0f), juce::Justification::centred, 3)', '(in.removeFromTop (70.0f)).toNearestInt(), juce::Justification::centred, 3)')
          $s = $s.Replace('c.reduced (10.0f), juce::Justification::centred, 2)', '(c.reduced (10.0f)).toNearestInt(), juce::Justification::centred, 2)')
          $s = $s.Replace('right.removeFromTop (100).reduced (120, 4, 4, 4)', 'right.removeFromTop (100).withTrimmedLeft (120).reduced (4)')
          $s = $s.Replace('right.removeFromTop (110).reduced (120, 6, 4, 6)', 'right.removeFromTop (110).withTrimmedLeft (120).withTrimmedTop (6).withTrimmedRight (4).withTrimmedBottom (6)')
          Set-Content $p $s -Encoding utf8
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build-fast -G "Visual Studio 17 2022" -A x64
      - name: Compile VST3 and Standalone
        shell: pwsh
        run: cmake --build build-fast --config Release --parallel 4
      - name: Verify outputs
        shell: pwsh
        run: |
          $vst3='build-fast\FORGE_artefacts\Release\VST3\FORGE.vst3\Contents\x86_64-win\FORGE.vst3'
          $exe='build-fast\FORGE_artefacts\Release\Standalone\FORGE.exe'
          if(-not (Test-Path $vst3)){throw "VST3 binary missing: $vst3"}
          if(-not (Test-Path $exe)){throw "Standalone missing: $exe"}
      - name: Upload compile proof
        uses: actions/upload-artifact@v4
        with:
          name: FORGE-fast-compile
          path: |
            build-fast/FORGE_artefacts/Release/VST3/FORGE.vst3/**
            build-fast/FORGE_artefacts/Release/Standalone/FORGE.exe
